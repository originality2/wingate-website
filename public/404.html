<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/?redirect=%2Fabout" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname + window.location.search;
      const redirect = path.startsWith("/wingate-website/")
        ? path.replace("/wingate-website", "")
        : path;

      const target = redirect && redirect !== "/" ? redirect : "/";
      window.location.replace(
        "/wingate-website" + target + window.location.hash,
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
